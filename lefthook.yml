pre-commit:
  parallel: true
  commands:
    "lint and format staged files":
      run: pnpm run lint:staged
      stage_fixed: true
    "check package.json files":
      run: pnpm run syncpack:format && pnpm run syncpack:lint
      stage_fixed: true
    "[repo] verify types":
      run: pnpm run typecheck
      tags:
        - types

pre-push:
  parallel: true
  commands:
    "[repo] check files lint cleanly":
      run: pnpm run lint:check
      tags:
        - lint

commit-msg:
  commands:
    "lint commit message":
      run: pnpm exec commitlint --edit {1}
